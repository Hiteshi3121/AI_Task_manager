name: Daily Brief Email

on:
  schedule:
    - cron: '30 2 * * *'  # 2:30 AM UTC = 8:00 AM IST
  workflow_dispatch:       # allows manual trigger from GitHub UI

jobs:
  send-brief:
    runs-on: ubuntu-latest
    steps:
      - name: Send daily brief email
        run: |
          curl -X POST https://ai-task-manager-udukku-backend.onrender.com/api/brief/send-email \
            --fail \
            --silent \
            --show-error
