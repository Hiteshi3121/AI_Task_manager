name: Daily Brief Email

on:
  schedule:
    - cron: '15 9 * * *'  # 9:15 AM UTC = 2:45 PM IST (test)
  workflow_dispatch:       # allows manual trigger from GitHub UI

jobs:
  send-brief:
    runs-on: ubuntu-latest
    steps:
      - name: Send daily brief email
        run: |
          curl -X POST https://ai-task-manager-udukku-backend.onrender.com/api/brief/send-email \
            --fail \
            --silent \
            --show-error
