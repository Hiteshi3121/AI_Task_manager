name: Daily Brief Email

on:
  schedule:
    - cron: '55 9 * * *'  # 9:55 AM UTC = 3:25 PM IST (test)
  workflow_dispatch:       # allows manual trigger from GitHub UI

jobs:
  send-brief:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up Render (free tier spin-up)
        run: |
          echo "Pinging Render to wake it up..."
          curl --silent --max-time 90 https://ai-task-manager-udukku-backend.onrender.com/api/tasks/ > /dev/null
          echo "Render is awake. Waiting 5 seconds before sending email..."
          sleep 5

      - name: Send daily brief email
        run: |
          curl -X POST https://ai-task-manager-udukku-backend.onrender.com/api/brief/send-email \
            --fail \
            --show-error \
            --max-time 60
